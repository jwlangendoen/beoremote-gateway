name: Gateway checks

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_release.py
      - run: bash tools/test_helper.sh
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: beoremote_gateway
      - name: Export and test the exact public source tree
        run: |
          python tools/export_release.py dist/source.zip
          python -m zipfile -e dist/source.zip dist/extracted
          cd dist/extracted/beoremote-gateway
          python tools/check_release.py
          PYTHONPATH=beoremote_gateway python -m unittest discover -s tests -v

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r requirements-dev.txt --progress-spinner off
      - run: bandit -r beoremote_gateway/gateway --severity-level high

  source-launch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Execute wake, readiness, cancellation and failure scenarios in isolated HA Core
        run: docker run --rm --network none -v "$PWD:/repo:ro" --entrypoint python ghcr.io/home-assistant/home-assistant:2026.10.4 /repo/tools/test_source_launch.py

  container:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --platform ${{ matrix.platform }} --build-arg BUILD_ARCH=${{ matrix.arch }} -t beoremote-gateway:ci beoremote_gateway
      - run: bash tools/container_check.sh beoremote-gateway:ci
