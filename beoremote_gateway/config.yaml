name: Beoremote Gateway
description: Use Beoremote LIGHT buttons in Home Assistant. Start the app, then Open Web UI to set up.
version: "0.6.0-dev6"
slug: beoremote_gateway
url: https://github.com/jwlangendoen/beoremote-gateway
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 15
stage: experimental
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 0
panel_icon: mdi:remote
panel_admin: true
options: {}
schema:
  mode: list(auto|disabled|listen|advertise)?
  horizon_address: str?
  horizon_jid: str?
  advertise_address: str?
  gateway_name: str(1,64)?
  gateway_jid: str(1,120)?
  xmpp_port: port?
  publish_ha_events: bool?
  log_level: list(debug|info|warning|error)?
